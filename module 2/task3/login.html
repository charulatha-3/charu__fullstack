<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Bloomé</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --pink: #e9a7bd;
            --dark-pink: #b95f7d;
            --light-pink: #fce8ef;
            --cream: #fffaf5;
            --lavender: #e8dff5;
            --text: #573d48;
            --muted: #987b86;
            --white: rgba(255,255,255,0.78);
        }

        body {
            min-height: 100vh;
            font-family: "Segoe UI", Arial, sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at 10% 15%, #f8dce8 0 8%, transparent 25%),
                radial-gradient(circle at 90% 20%, #e8dff5 0 9%, transparent 25%),
                radial-gradient(circle at 80% 90%, #f9dfd0 0 8%, transparent 25%),
                linear-gradient(135deg, #fffaf7, #fdf0f5, #f5eefb);
            overflow: hidden;
        }

        .page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 25px;
        }

        .decoration {
            position: absolute;
            pointer-events: none;
            user-select: none;
        }

        .flower {
            font-size: 42px;
            animation: float 5s ease-in-out infinite;
        }

        .flower.one {
            top: 9%;
            left: 10%;
        }

        .flower.two {
            bottom: 10%;
            right: 11%;
            font-size: 36px;
            animation-delay: 1.5s;
        }

        .flower.three {
            top: 17%;
            right: 15%;
            font-size: 28px;
            animation-delay: 2s;
        }

        .bow {
            font-size: 52px;
            top: 12%;
            left: 24%;
            transform: rotate(-8deg);
            animation: gentleRotate 5s ease-in-out infinite;
        }

        .bow.two {
            bottom: 13%;
            left: 15%;
            font-size: 38px;
            animation-delay: 1s;
        }

        .sparkle {
            color: #d98aa4;
            font-size: 25px;
            animation: twinkle 2.5s ease-in-out infinite;
        }

        .sparkle.one {
            top: 26%;
            left: 17%;
        }

        .sparkle.two {
            bottom: 23%;
            right: 22%;
            animation-delay: .8s;
        }

        .sparkle.three {
            top: 11%;
            right: 31%;
            animation-delay: 1.2s;
        }

        .heart {
            color: #d889a3;
            font-size: 22px;
            animation: float 4s ease-in-out infinite;
        }

        .heart.one {
            bottom: 24%;
            left: 26%;
        }

        .heart.two {
            top: 32%;
            right: 17%;
            animation-delay: 1s;
        }

        .daisy {
            position: absolute;
            width: 110px;
            height: 110px;
            border-radius: 50%;
            border: 2px dashed rgba(185,95,125,.18);
        }

        .daisy.one {
            top: -35px;
            left: -35px;
        }

        .daisy.two {
            bottom: -40px;
            right: -35px;
            width: 145px;
            height: 145px;
        }

        .login-card {
            width: min(430px, 100%);
            padding: 42px 40px 34px;
            background: var(--white);
            border: 1px solid rgba(255,255,255,.8);
            border-radius: 32px;
            box-shadow:
                0 30px 70px rgba(132, 82, 105, .15),
                inset 0 1px 0 rgba(255,255,255,.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            position: relative;
            z-index: 5;
            animation: cardAppear .8s ease;
        }

        .mini-label {
            text-align: center;
            font-size: 12px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--dark-pink);
            font-weight: 700;
            margin-bottom: 12px;
        }

        .logo {
            width: 72px;
            height: 72px;
            margin: 0 auto 18px;
            border-radius: 50%;
            background: linear-gradient(145deg, #f7c5d6, #e8d8f2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 34px;
            box-shadow: 0 12px 25px rgba(185,95,125,.16);
        }

        h1 {
            text-align: center;
            font-family: Georgia, serif;
            font-size: 39px;
            font-weight: 500;
            color: #684653;
            margin-bottom: 9px;
        }

        .subtitle {
            text-align: center;
            color: var(--muted);
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 29px;
        }

        .input-group {
            margin-bottom: 18px;
        }

        .input-group label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 8px;
            color: #725361;
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 17px;
            opacity: .7;
        }

        input {
            width: 100%;
            height: 52px;
            border: 1px solid #ead4dd;
            border-radius: 16px;
            background: rgba(255,255,255,.72);
            padding: 0 45px 0 46px;
            outline: none;
            color: var(--text);
            font-size: 14px;
            transition: .3s ease;
        }

        input::placeholder {
            color: #bba4ad;
        }

        input:focus {
            border-color: var(--pink);
            box-shadow: 0 0 0 4px rgba(233,167,189,.16);
            background: #fff;
        }

        .toggle-password {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 17px;
            opacity: .65;
            transition: .2s;
        }

        .toggle-password:hover {
            opacity: 1;
            transform: translateY(-50%) scale(1.1);
        }

        .options {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 4px 2px 23px;
            font-size: 12px;
        }

        .remember {
            display: flex;
            align-items: center;
            gap: 7px;
            color: var(--muted);
            cursor: pointer;
        }

        .remember input {
            width: 15px;
            height: 15px;
            padding: 0;
            accent-color: var(--dark-pink);
            box-shadow: none;
        }

        .forgot {
            color: var(--dark-pink);
            text-decoration: none;
            font-weight: 700;
            cursor: pointer;
        }

        .forgot:hover {
            text-decoration: underline;
        }

        .login-btn {
            width: 100%;
            height: 54px;
            border: none;
            border-radius: 17px;
            background: linear-gradient(135deg, #d98ca6, #bc6d89);
            color: white;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: .3px;
            cursor: pointer;
            box-shadow: 0 12px 25px rgba(185,95,125,.24);
            transition: .3s ease;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 16px 30px rgba(185,95,125,.3);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .message {
            min-height: 22px;
            text-align: center;
            margin-top: 15px;
            font-size: 13px;
            font-weight: 600;
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 24px 0 19px;
            color: #b69ba6;
            font-size: 11px;
        }

        .divider::before,
        .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #ead9df;
        }

        .signup {
            text-align: center;
            font-size: 13px;
            color: var(--muted);
        }

        .signup a {
            color: var(--dark-pink);
            font-weight: 800;
            text-decoration: none;
            margin-left: 4px;
        }

        .signup a:hover {
            text-decoration: underline;
        }

        .bottom-note {
            text-align: center;
            margin-top: 24px;
            font-size: 11px;
            color: #b59ba5;
        }

        @keyframes cardAppear {
            from {
                opacity: 0;
                transform: translateY(25px) scale(.97);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-12px);
            }
        }

        @keyframes twinkle {
            0%, 100% {
                opacity: .35;
                transform: scale(.9);
            }
            50% {
                opacity: 1;
                transform: scale(1.2);
            }
        }

        @keyframes gentleRotate {
            0%, 100% {
                transform: rotate(-8deg) translateY(0);
            }
            50% {
                transform: rotate(5deg) translateY(-8px);
            }
        }

        @media (max-width: 650px) {
            body {
                overflow-y: auto;
            }

            .page {
                padding: 20px;
            }

            .login-card {
                padding: 35px 25px 28px;
                border-radius: 27px;
            }

            h1 {
                font-size: 34px;
            }

            .flower.one,
            .flower.three,
            .bow,
            .sparkle.one,
            .heart.two {
                display: none;
            }
        }

        @media (max-height: 700px) {
            .page {
                align-items: flex-start;
                padding-top: 35px;
                padding-bottom: 35px;
                overflow-y: auto;
            }
        }
    </style>
</head>

<body>

    <div class="page">

        <div class="decoration flower one">🌷</div>
        <div class="decoration flower two">🌸</div>
        <div class="decoration flower three">🌼</div>

        <div class="decoration bow">🎀</div>
        <div class="decoration bow two">🎀</div>

        <div class="decoration sparkle one">✦</div>
        <div class="decoration sparkle two">✧</div>
        <div class="decoration sparkle three">✦</div>

        <div class="decoration heart one">♡</div>
        <div class="decoration heart two">♡</div>

        <div class="daisy one"></div>
        <div class="daisy two"></div>

        <main class="login-card">

            <div class="mini-label">Welcome back</div>

            <div class="logo">
                🌷
            </div>

            <h1>Bloomé</h1>

            <p class="subtitle">
                A little space made for you.<br>
                Sign in and continue your journey ✨
            </p>

            <form id="loginForm">

                <div class="input-group">
                    <label for="email">Email address</label>

                    <div class="input-wrapper">
                        <span class="input-icon">♡</span>

                        <input
                            type="email"
                            id="email"
                            placeholder="yourname@email.com"
                            autocomplete="email"
                        >
                    </div>
                </div>

                <div class="input-group">
                    <label for="password">Password</label>

                    <div class="input-wrapper">
                        <span class="input-icon">✿</span>

                        <input
                            type="password"
                            id="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                        >

                        <button
                            type="button"
                            class="toggle-password"
                            id="togglePassword"
                            aria-label="Show password"
                        >
                            ♡
                        </button>
                    </div>
                </div>

                <div class="options">

                    <label class="remember">
                        <input type="checkbox" id="remember">
                        <span>Remember me</span>
                    </label>

                    <a href="#" class="forgot" id="forgotPassword">
                        Forgot password?
                    </a>

                </div>

                <button type="submit" class="login-btn">
                    Sign In ✨
                </button>

                <div class="message" id="message"></div>

            </form>

            <div class="divider">
                OR
            </div>

            <div class="signup">
                Don't have an account?
                <a href="#" id="signupLink">Create one</a>
            </div>

            <div class="bottom-note">
                Made with ♡ and a little sparkle
            </div>

        </main>
    </div>

    <script>
        const loginForm = document.getElementById("loginForm");
        const email = document.getElementById("email");
        const password = document.getElementById("password");
        const message = document.getElementById("message");
        const togglePassword = document.getElementById("togglePassword");
        const forgotPassword = document.getElementById("forgotPassword");
        const signupLink = document.getElementById("signupLink");

        togglePassword.addEventListener("click", () => {
            const isPassword = password.type === "password";

            password.type = isPassword ? "text" : "password";

            togglePassword.textContent = isPassword ? "♥" : "♡";
        });

        loginForm.addEventListener("submit", (event) => {
            event.preventDefault();

            const emailValue = email.value.trim();
            const passwordValue = password.value.trim();

            if (!emailValue || !passwordValue) {
                message.textContent = "Please fill in both fields ♡";
                message.style.color = "#c36f89";
                return;
            }

            if (!emailValue.includes("@")) {
                message.textContent = "Please enter a valid email ✿";
                message.style.color = "#c36f89";
                return;
            }

            message.textContent = "Welcome back, lovely! ✨";
            message.style.color = "#a35c77";
        });

        forgotPassword.addEventListener("click", (event) => {
            event.preventDefault();

            message.textContent = "Password reset feature coming soon ♡";
            message.style.color = "#a35c77";
        });

        signupLink.addEventListener("click", (event) => {
            event.preventDefault();

            message.textContent = "Create account feature coming soon ✨";
            message.style.color = "#a35c77";
        });
    </script>

</body>
</html>
