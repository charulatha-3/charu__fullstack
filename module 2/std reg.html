<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --sage: #8fa98d;
            --deep-sage: #5f7963;
            --soft-sage: #dce8dc;
            --cream: #faf8f1;
            --beige: #eee8d9;
            --brown: #776c5c;
            --dark: #435347;
            --white: rgba(255,255,255,.78);
            --border: #d9dfd4;
        }

        body {
            min-height: 100vh;
            font-family: "Segoe UI", Arial, sans-serif;
            color: var(--dark);
            background:
                radial-gradient(circle at 10% 10%, #dfeadf 0, transparent 25%),
                radial-gradient(circle at 90% 15%, #eee8d9 0, transparent 25%),
                radial-gradient(circle at 85% 90%, #dbe7df 0, transparent 24%),
                linear-gradient(135deg, #faf8f1, #f3f6ef, #f8f4eb);
            overflow-x: hidden;
        }

        .page {
            min-height: 100vh;
            padding: 45px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Educational Charms */

        .charm {
            position: absolute;
            pointer-events: none;
            user-select: none;
            z-index: 1;
        }

        .book {
            font-size: 52px;
            animation: float 5s ease-in-out infinite;
        }

        .book.one {
            top: 8%;
            left: 9%;
        }

        .book.two {
            bottom: 9%;
            right: 9%;
            font-size: 44px;
            animation-delay: 1.2s;
        }

        .pencil {
            font-size: 42px;
            top: 16%;
            right: 13%;
            transform: rotate(-25deg);
            animation: pencilFloat 5s ease-in-out infinite;
        }

        .cap {
            font-size: 48px;
            bottom: 13%;
            left: 10%;
            animation: float 4.5s ease-in-out infinite;
            animation-delay: .8s;
        }

        .notebook {
            font-size: 38px;
            top: 28%;
            left: 17%;
            animation: float 5s ease-in-out infinite;
            animation-delay: 1s;
        }

        .bulb {
            font-size: 35px;
            right: 18%;
            bottom: 27%;
            animation: glow 3s ease-in-out infinite;
        }

        .star {
            font-size: 22px;
            color: #9bad8d;
            animation: twinkle 2.5s ease-in-out infinite;
        }

        .star.one {
            top: 20%;
            left: 25%;
        }

        .star.two {
            top: 12%;
            right: 28%;
            animation-delay: .7s;
        }

        .star.three {
            bottom: 22%;
            right: 24%;
            animation-delay: 1.4s;
        }

        .leaf {
            font-size: 27px;
            color: #78917b;
            animation: float 4s ease-in-out infinite;
        }

        .leaf.one {
            bottom: 30%;
            left: 24%;
        }

        .leaf.two {
            top: 32%;
            right: 11%;
            animation-delay: 1.5s;
        }

        /* Decorative circles */

        .circle {
            position: absolute;
            border: 1px dashed rgba(95,121,99,.18);
            border-radius: 50%;
            pointer-events: none;
        }

        .circle.one {
            width: 150px;
            height: 150px;
            top: -60px;
            left: -60px;
        }

        .circle.two {
            width: 190px;
            height: 190px;
            bottom: -80px;
            right: -70px;
        }

        /* Main Card */

        .registration-card {
            width: min(900px, 100%);
            background: var(--white);
            border: 1px solid rgba(255,255,255,.9);
            border-radius: 30px;
            box-shadow:
                0 25px 70px rgba(69,86,70,.13),
                inset 0 1px 0 rgba(255,255,255,.9);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            padding: 42px;
            position: relative;
            z-index: 5;
            animation: appear .7s ease;
        }

        .header {
            text-align: center;
            margin-bottom: 34px;
        }

        .icon-box {
            width: 72px;
            height: 72px;
            margin: 0 auto 16px;
            border-radius: 22px;
            background: linear-gradient(
                145deg,
                #dbe8da,
                #eee8d9
            );
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            box-shadow: 0 10px 25px rgba(95,121,99,.12);
        }

        .small-title {
            text-transform: uppercase;
            letter-spacing: 3px;
            font-size: 11px;
            color: var(--deep-sage);
            font-weight: 700;
            margin-bottom: 8px;
        }

        h1 {
            font-family: Georgia, serif;
            font-size: 38px;
            font-weight: 500;
            color: #4f6252;
            margin-bottom: 9px;
        }

        .subtitle {
            color: #8a9185;
            font-size: 14px;
            line-height: 1.6;
        }

        /* Form */

        .form-section {
            margin-bottom: 27px;
        }

        .section-title {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 17px;
            font-size: 15px;
            font-weight: 700;
            color: var(--deep-sage);
        }

        .section-title span {
            width: 29px;
            height: 29px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            background: var(--soft-sage);
            font-size: 15px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
        }

        .full {
            grid-column: 1 / -1;
        }

        .field label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            color: #667268;
            margin-bottom: 7px;
        }

        .input-wrap {
            position: relative;
        }

        .field-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            opacity: .65;
            font-size: 16px;
        }

        input,
        select {
            width: 100%;
            height: 49px;
            border: 1px solid var(--border);
            border-radius: 14px;
            outline: none;
            background: rgba(255,255,255,.72);
            color: var(--dark);
            padding: 0 15px 0 42px;
            font-size: 13px;
            transition: .25s ease;
        }

        select {
            appearance: none;
            cursor: pointer;
        }

        input::placeholder {
            color: #aeb5aa;
        }

        input:focus,
        select:focus {
            border-color: var(--sage);
            box-shadow: 0 0 0 4px rgba(143,169,141,.14);
            background: #fff;
        }

        .select-wrap::after {
            content: "⌄";
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--deep-sage);
            pointer-events: none;
        }

        /* Gender */

        .gender-options {
            display: flex;
            gap: 10px;
        }

        .gender-option {
            flex: 1;
            position: relative;
        }

        .gender-option input {
            position: absolute;
            opacity: 0;
            pointer-events: none;
        }

        .gender-option label {
            height: 49px;
            border: 1px solid var(--border);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            background: rgba(255,255,255,.6);
            color: #7b8378;
            transition: .25s ease;
            font-size: 12px;
        }

        .gender-option input:checked + label {
            background: var(--soft-sage);
            border-color: var(--sage);
            color: var(--deep-sage);
            font-weight: 700;
        }

        /* Terms */

        .terms {
            display: flex;
            align-items: flex-start;
            gap: 9px;
            margin: 8px 0 21px;
            color: #858c82;
            font-size: 12px;
            line-height: 1.5;
        }

        .terms input {
            width: 16px;
            height: 16px;
            min-width: 16px;
            margin-top: 2px;
            padding: 0;
            accent-color: var(--deep-sage);
            box-shadow: none;
        }

        .terms a {
            color: var(--deep-sage);
            text-decoration: none;
            font-weight: 700;
        }

        /* Button */

        .register-btn {
            width: 100%;
            height: 54px;
            border: none;
            border-radius: 16px;
            background: linear-gradient(
                135deg,
                #8fa98d,
                #6f896f
            );
            color: white;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: .3px;
            cursor: pointer;
            box-shadow: 0 12px 24px rgba(95,121,99,.22);
            transition: .3s ease;
        }

        .register-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 16px 30px rgba(95,121,99,.28);
        }

        .register-btn:active {
            transform: translateY(0);
        }

        .message {
            min-height: 21px;
            text-align: center;
            margin-top: 13px;
            font-size: 12px;
            font-weight: 600;
        }

        .login-text {
            text-align: center;
            color: #92988e;
            font-size: 12px;
            margin-top: 20px;
        }

        .login-text a {
            color: var(--deep-sage);
            font-weight: 700;
            text-decoration: none;
        }

        /* Animations */

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(20px) scale(.98);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px);
            }
        }

        @keyframes pencilFloat {
            0%, 100% {
                transform: rotate(-25deg) translateY(0);
            }

            50% {
                transform: rotate(-18deg) translateY(-10px);
            }
        }

        @keyframes twinkle {
            0%, 100% {
                opacity: .35;
                transform: scale(.9);
            }

            50% {
                opacity: 1;
                transform: scale(1.2);
            }
        }

        @keyframes glow {
            0%, 100% {
                opacity: .55;
                transform: scale(.95);
            }

            50% {
                opacity: 1;
                transform: scale(1.08);
            }
        }

        /* Responsive */

        @media (max-width: 720px) {
            .registration-card {
                padding: 32px 23px;
                border-radius: 25px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .full {
                grid-column: auto;
            }

            h1 {
                font-size: 32px;
            }

            .book.one,
            .notebook,
            .pencil,
            .leaf.two {
                display: none;
            }
        }

        @media (max-width: 480px) {
            .page {
                padding: 25px 14px;
            }

            .registration-card {
                padding: 28px 19px;
            }

            .gender-options {
                flex-direction: column;
            }

            .cap,
            .bulb,
            .star.one {
                display: none;
            }
        }
    </style>
</head>

<body>

    <div class="page">

        <div class="charm book one">📚</div>
        <div class="charm book two">📖</div>
        <div class="charm pencil">✏️</div>
        <div class="charm cap">🎓</div>
        <div class="charm notebook">📓</div>
        <div class="charm bulb">💡</div>

        <div class="charm star one">✦</div>
        <div class="charm star two">✧</div>
        <div class="charm star three">✦</div>

        <div class="charm leaf one">☘</div>
        <div class="charm leaf two">❧</div>

        <div class="circle one"></div>
        <div class="circle two"></div>

        <main class="registration-card">

            <header class="header">

                <div class="icon-box">
                    📚
                </div>

                <div class="small-title">
                    Student Portal
                </div>

                <h1>Student Registration</h1>

                <p class="subtitle">
                    Begin your academic journey with us.<br>
                    Fill in your details to create your student account.
                </p>

            </header>

            <form id="registrationForm">

                <section class="form-section">

                    <div class="section-title">
                        <span>👤</span>
                        Personal Details
                    </div>

                    <div class="form-grid">

                        <div class="field">
                            <label for="firstName">First Name</label>

                            <div class="input-wrap">
                                <span class="field-icon">🌿</span>
                                <input
                                    type="text"
                                    id="firstName"
                                    placeholder="Enter first name"
                                >
                            </div>
                        </div>

                        <div class="field">
                            <label for="lastName">Last Name</label>

                            <div class="input-wrap">
                                <span class="field-icon">🌿</span>
                                <input
                                    type="text"
                                    id="lastName"
                                    placeholder="Enter last name"
                                >
                            </div>
                        </div>

                        <div class="field">
                            <label for="dob">Date of Birth</label>

                            <div class="input-wrap">
                                <span class="field-icon">🌱</span>
                                <input
                                    type="date"
                                    id="dob"
                                >
                            </div>
                        </div>

                        <div class="field">
                            <label>Gender</label>

                            <div class="gender-options">

                                <div class="gender-option">
                                    <input
                                        type="radio"
                                        id="female"
                                        name="gender"
                                        value="Female"
                                    >
                                    <label for="female">Female</label>
                                </div>

                                <div class="gender-option">
                                    <input
                                        type="radio"
                                        id="male"
                                        name="gender"
                                        value="Male"
                                    >
                                    <label for="male">Male</label>
                                </div>

                                <div class="gender-option">
                                    <input
                                        type="radio"
                                        id="other"
                                        name="gender"
                                        value="Other"
                                    >
                                    <label for="other">Other</label>
                                </div>

                            </div>
                        </div>

                    </div>

                </section>

                <section class="form-section">

                    <div class="section-title">
                        <span>🎓</span>
                        Academic Details
                    </div>

                    <div class="form-grid">

                        <div class="field">
                            <label for="studentId">Student ID</label>

                            <div class="input-wrap">
                                <span class="field-icon">🪪</span>
                                <input
                                    type="text"
                                    id="studentId"
                                    placeholder="Enter student ID"
                                >
                            </div>
                        </div>

                        <div class="field">
                            <label for="department">Department</label>

                            <div class="input-wrap select-wrap">
                                <span class="field-icon">📚</span>

                                <select id="department">
                                    <option value="">Select department</option>
                                    <option>Computer Science & Engineering</option>
                                    <option>Information Technology</option>
                                    <option>Artificial Intelligence</option>
                                    <option>Electronics & Communication</option>
                                    <option>Electrical & Electronics</option>
                                    <option>Mechanical Engineering</option>
                                    <option>Civil Engineering</option>
                                </select>
                            </div>
                        </div>

                        <div class="field">
                            <label for="year">Year of Study</label>

                            <div class="input-wrap select-wrap">
                                <span class="field-icon">📖</span>

                                <select id="year">
                                    <option value="">Select year</option>
                                    <option>1st Year</option>
                                    <option>2nd Year</option>
                                    <option>3rd Year</option>
                                    <option>4th Year</option>
                                </select>
                            </div>
                        </div>

                        <div class="field">
                            <label for="semester">Semester</label>

                            <div class="input-wrap select-wrap">
                                <span class="field-icon">📝</span>

                                <select id="semester">
                                    <option value="">Select semester</option>
                                    <option>Semester 1</option>
                                    <option>Semester 2</option>
                                    <option>Semester 3</option>
                                    <option>Semester 4</option>
                                    <option>Semester 5</option>
                                    <option>Semester 6</option>
                                    <option>Semester 7</option>
                                    <option>Semester 8</option>
                                </select>
                            </div>
                        </div>

                    </div>

                </section>

                <section class="form-section">

                    <div class="section-title">
                        <span>✉️</span>
                        Contact Details
                    </div>

                    <div class="form-grid">

                        <div class="field">
                            <label for="email">Email Address</label>

                            <div class="input-wrap">
                                <span class="field-icon">✉</span>
                                <input
                                    type="email"
                                    id="email"
                                    placeholder="student@email.com"
                                >
                            </div>
                        </div>

                        <div class="field">
                            <label for="phone">Phone Number</label>

                            <div class="input-wrap">
                                <span class="field-icon">☎</span>
                                <input
                                    type="tel"
                                    id="phone"
                                    placeholder="Enter phone number"
                                >
                            </div>
                        </div>

                        <div class="field full">
                            <label for="address">Address</label>

                            <div class="input-wrap">
                                <span class="field-icon">⌂</span>
                                <input
                                    type="text"
                                    id="address"
                                    placeholder="Enter your address"
                                >
                            </div>
                        </div>

                    </div>

                </section>

                <section class="form-section">

                    <div class="section-title">
                        <span>🔐</span>
                        Account Details
                    </div>

                    <div class="form-grid">

                        <div class="field">
                            <label for="password">Create Password</label>

                            <div class="input-wrap">
                                <span class="field-icon">🔑</span>

                                <input
                                    type="password"
                                    id="password"
                                    placeholder="Create password"
                                >
                            </div>
                        </div>

                        <div class="field">
                            <label for="confirmPassword">Confirm Password</label>

                            <div class="input-wrap">
                                <span class="field-icon">🔒</span>

                                <input
                                    type="password"
                                    id="confirmPassword"
                                    placeholder="Confirm password"
                                >
                            </div>
                        </div>

                    </div>

                </section>

                <label class="terms">
                    <input type="checkbox" id="terms">

                    <span>
                        I agree to the
                        <a href="#">student portal terms</a>
                        and confirm that the information provided is accurate.
                    </span>
                </label>

                <button type="submit" class="register-btn">
                    Create Student Account ✨
                </button>

                <div class="message" id="message"></div>

                <div class="login-text">
                    Already have an account?
                    <a href="#">Sign in</a>
                </div>

            </form>

        </main>

    </div>

    <script>
        const form = document.getElementById("registrationForm");
        const message = document.getElementById("message");

        form.addEventListener("submit", function(event) {
            event.preventDefault();

            const firstName = document.getElementById("firstName").value.trim();
            const lastName = document.getElementById("lastName").value.trim();
            const studentId = document.getElementById("studentId").value.trim();
            const department = document.getElementById("department").value;
            const year = document.getElementById("year").value;
            const semester = document.getElementById("semester").value;
            const email = document.getElementById("email").value.trim();
            const phone = document.getElementById("phone").value.trim();
            const password = document.getElementById("password").value;
            const confirmPassword = document.getElementById("confirmPassword").value;
            const terms = document.getElementById("terms").checked;

            if (
                !firstName ||
                !lastName ||
                !studentId ||
                !department ||
                !year ||
                !semester ||
                !email ||
                !phone ||
                !password ||
                !confirmPassword
            ) {
                message.textContent = "Please complete all required fields 📚";
                message.style.color = "#b36d6d";
                return;
            }

            if (!email.includes("@")) {
                message.textContent = "Please enter a valid email address ✉";
                message.style.color = "#b36d6d";
                return;
            }

            if (password.length < 6) {
                message.textContent = "Password should contain at least 6 characters 🔐";
                message.style.color = "#b36d6d";
                return;
            }

            if (password !== confirmPassword) {
                message.textContent = "Passwords do not match 🌿";
                message.style.color = "#b36d6d";
                return;
            }

            if (!terms) {
                message.textContent = "Please accept the terms to continue ✨";
                message.style.color = "#b36d6d";
                return;
            }

            message.textContent =
                "Registration successful! Welcome to your student journey 🎓";
            message.style.color = "#5f7963";
        });
    </script>

</body>
</html>
